# --- Font ---
font_size 13.0

# --- Alerts ---
enable_audio_bell no

# --- Mouse-daemon markers ---
# Discard unused F23/F24 events emitted by the mouse thumb-wheel daemon.
map f23 discard_event
map f24 discard_event

# --- Modified Tab forwarding ---
# Clear Kitty's defaults, then send CSI-u sequences understood by tmux extkeys.
map ctrl+tab
map ctrl+shift+tab
map ctrl+tab send_text normal,application \x1b[9;5u
map ctrl+shift+tab send_text normal,application \x1b[9;6u
