# Let tmux own mouse clicks, pane resizing, and scrollback interaction.
set-option -g mouse on

# Accept OSC 52 from applications and forward clipboard updates to the terminal.
set-option -s set-clipboard on

# Number windows and panes from 1 instead of 0.
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Close gaps in window numbers after a window is removed.
set-option -g renumber-windows on

# Abbreviate $HOME to ~ while keeping other directories as their basename.
%hidden SHORT_PATH="#{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}}"

# Name windows automatically from their directory and foreground command.
# Manual renames (prefix + ,) still stick because tmux disables automatic-rename per window.
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format "#{?pane_in_mode,[tmux],$SHORT_PATH:#{pane_current_command}}#{?pane_dead,[dead],}"

# Keep manual pane titles (prefix + T) from being overwritten by shell title escapes.
# allow-set-title was added in tmux 3.5; skip cleanly on older servers.
%if "#{>=:#{version},3.5}"
set-window-option -g allow-set-title off
%endif
