# --- Plugin manager ---
# Keep plugins under the XDG tmux directory instead of ~/.tmux/plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
set-option -g @plugin 'tmux-plugins/tmux-continuum'

# --- Session persistence across reboots ---
# Avoid overwriting prefix + C-s (send-prefix) by moving manual save to Alt-s.
set-option -g @resurrect-save 'M-s'
set-option -g @resurrect-restore 'C-r'
set-option -g @resurrect-capture-pane-contents 'on'

# Automatically save every 15 minutes; restore manually with prefix + C-r.
set-option -g @continuum-save-interval '15'
set-option -g @continuum-restore 'off'

# Initialize TPM only if installed so missing plugins never error on fresh hosts.
if-shell 'test -x "$HOME/.config/tmux/plugins/tpm/tpm"' {
  run-shell '"$HOME/.config/tmux/plugins/tpm/tpm"'
}
