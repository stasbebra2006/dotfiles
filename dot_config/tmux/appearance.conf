# --- Status line ---
# Draw the status line above the panes with a neutral colour palette.
set-option -g status-position top
set-option -g status-style "bg=colour235,fg=colour250"
set-option -g status-justify left
set-option -g status-left-length 50
set-option -g status-right-length 50
set-option -g status-left "#{?client_prefix,#[bg=colour250#,fg=colour235#,bold] PREFIX #[bg=colour235] ,}#[fg=colour255,bold] #S#{?@note, #[fg=colour245#,nobold](#{@note}),} #[fg=colour238]│ #[default]"
set-option -g status-right "#{?@passthrough,#[fg=colour203] PASSTHROUGH ,#[fg=colour245] ACTIVE }#[fg=colour238]│ #[fg=colour245]%Y-%m-%d  %H:%M "

# --- Window list ---
# Highlight the active window and show an optional fourth @wlabel segment (#I:#W:@wlabel).
set-window-option -g window-status-separator ""
set-window-option -g window-status-format "#[fg=colour245] #I:#W#{?@wlabel,#[fg=colour238]:#[fg=colour109]#{@wlabel},} "
set-window-option -g window-status-current-format "#[bg=colour240,fg=colour255,bold] #I:#W#{?@wlabel,#[fg=colour245#,nobold]:#[fg=colour152#,bold]#{@wlabel},} #[default]"
set-window-option -g window-status-activity-style "fg=colour255,bold"

# --- Pane and interface colours ---
set-option -g pane-border-style "fg=colour238"
set-option -g pane-active-border-style "fg=colour245"
set-option -g message-style "bg=colour240,fg=colour255"
set-option -g mode-style "bg=colour240,fg=colour255"
set-option -g clock-mode-colour colour245

# Match floating popups to the neutral palette (options added in tmux 3.3).
%if "#{>=:#{version},3.3}"
set-option -g popup-style "bg=colour234,fg=colour250"
set-option -g popup-border-style "bg=colour234,fg=colour240"
set-option -g popup-border-lines rounded
%endif
