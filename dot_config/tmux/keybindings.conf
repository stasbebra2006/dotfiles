# --- Prefix ---
# Ctrl-s begins a tmux command sequence; the default Ctrl-b is disabled.
set-option -g prefix C-s
unbind-key C-b

# Press Ctrl-s twice to send one Ctrl-s through to the pane.
bind-key C-s send-prefix

# --- Extended keys ---
# Preserve modified Tab keys through physical terminals and nested tmux.
# Fixed indexes prevent repeated reloads from appending duplicate entries.
set-option -g extended-keys on
set-option -g terminal-features[100] 'xterm*:extkeys:sync'
set-option -g terminal-features[101] 'konsole*:extkeys:sync'
set-option -g terminal-features[102] 'tmux*:extkeys'

# --- Prefix-free window navigation ---
# -n makes these bindings work without pressing the prefix first.
bind-key -n C-Tab next-window
# Terminals report Ctrl-Shift-Tab to tmux as Control-Backtab.
bind-key -n C-BTab previous-window

# --- Reload ---
# A running tmux server does not watch config files for changes.
# Prefix followed by r reads the entry point and all its files again.
unbind-key r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# --- Pane navigation ---
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# --- Splits ---
# Create splits in the current pane's working directory.
bind-key '|' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"

# Remove tmux's default split shortcuts so there is one intended method.
unbind-key '"'
unbind-key %
