# --- Prefix ---
# Ctrl-s begins a tmux command sequence; the default Ctrl-b is disabled.
set-option -g prefix C-s
unbind-key C-b

# Press Ctrl-s twice to send one Ctrl-s through to the pane.
bind-key C-s send-prefix

# --- Extended keys ---
# Preserve modified Tab keys through physical terminals and nested tmux.
# Fixed indexes prevent repeated reloads from appending duplicate entries.
set-option -g extended-keys on
set-option -g terminal-features[100] 'xterm*:extkeys:sync'
set-option -g terminal-features[101] 'konsole*:extkeys:sync'
set-option -g terminal-features[102] 'tmux*:extkeys'

# --- Prefix-free window navigation ---
# -n makes these bindings work without pressing the prefix first.
bind-key -n C-Tab next-window
# Terminals report Ctrl-Shift-Tab to tmux as Control-Backtab.
bind-key -n C-BTab previous-window

# --- Reload ---
# A running tmux server does not watch config files for changes.
# Prefix followed by r reads the entry point and all its files again.
unbind-key r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# --- Pane navigation ---
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# --- Splits ---
# Create splits in the current pane's working directory.
bind-key '|' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"

# Remove tmux's default split shortcuts so there is one intended method.
unbind-key '"'
unbind-key %

# --- Labels and session navigation ---
# Route prompt actions through tmux-switcher popups so Esc always cancels cleanly;
# fall back to built-in tmux prompts on hosts without ~/.local/bin/tmux-switcher.
bind-key T if-shell 'test -x "$HOME/.local/bin/tmux-switcher"' {
  display-popup -E -b rounded -s 'bg=colour234,fg=colour250' -S 'bg=colour234,fg=colour240' -w '56%' -h '5' -T ' Pane label ' '"$HOME/.local/bin/tmux-switcher" prompt-plabel'
} {
  command-prompt -p "Pane label:" -I "#{@label}" { set-option -p @label "%1" ; select-pane -T "%1" }
}

bind-key W if-shell 'test -x "$HOME/.local/bin/tmux-switcher"' {
  display-popup -E -b rounded -s 'bg=colour234,fg=colour250' -S 'bg=colour234,fg=colour240' -w '56%' -h '5' -T ' Window label ' '"$HOME/.local/bin/tmux-switcher" prompt-wlabel'
} {
  command-prompt -p "Window label:" -I "#{@wlabel}" { set-option -w @wlabel "%%%" }
}

bind-key N if-shell 'test -x "$HOME/.local/bin/tmux-switcher"' {
  display-popup -E -b rounded -s 'bg=colour234,fg=colour250' -S 'bg=colour234,fg=colour240' -w '56%' -h '5' -T ' Session note ' '"$HOME/.local/bin/tmux-switcher" prompt-note'
} {
  command-prompt -p "Session note:" -I "#{@note}" { set-option @note "%%%" }
}

bind-key S if-shell 'test -x "$HOME/.local/bin/tmux-switcher"' {
  display-popup -E -b rounded -s 'bg=colour234,fg=colour250' -S 'bg=colour234,fg=colour240' -w '56%' -h '5' -T ' New session ' -d '#{pane_current_path}' '"$HOME/.local/bin/tmux-switcher" new-session'
} {
  command-prompt -p "New session:" { new-session -d -s "%1" -c "#{pane_current_path}" ; switch-client -t "=%1" }
}

bind-key '$' if-shell 'test -x "$HOME/.local/bin/tmux-switcher"' {
  display-popup -E -b rounded -s 'bg=colour234,fg=colour250' -S 'bg=colour234,fg=colour240' -w '56%' -h '5' -T ' Rename session ' '"$HOME/.local/bin/tmux-switcher" rename-session'
} {
  command-prompt -I "#S" { rename-session "%%" }
}

bind-key ',' if-shell 'test -x "$HOME/.local/bin/tmux-switcher"' {
  display-popup -E -b rounded -s 'bg=colour234,fg=colour250' -S 'bg=colour234,fg=colour240' -w '56%' -h '5' -T ' Rename window ' '"$HOME/.local/bin/tmux-switcher" rename-window'
} {
  command-prompt -I "#W" { rename-window "%%" }
}

# Show session notes, window/pane labels, directories, and commands in the tree switcher fallback.
%hidden TREE_FORMAT="#{?session_format,#{?@note,(#{@note}) ,}#{session_windows}w · $SHORT_PATH#{?session_attached, [attached],},#{?window_format,#W#{?@wlabel,:#{@wlabel},}#{?#{==:#{window_name},$SHORT_PATH:#{pane_current_command}},, · $SHORT_PATH (#{pane_current_command})}#{?window_active, *,},#{?@label,[#{@label}] ,}$SHORT_PATH (#{pane_current_command})#{?pane_active, *,}}}"

# Open a rounded fzf popup with live previews when fzf is installed; otherwise use choose-tree.
bind-key s if-shell 'command -v fzf >/dev/null 2>&1 && test -x "$HOME/.local/bin/tmux-switcher"' {
  display-popup -E -b rounded -s 'bg=colour234,fg=colour250' -S 'bg=colour234,fg=colour240' -w '82%' -h '75%' -T ' Sessions ' -d '#{pane_current_path}' '"$HOME/.local/bin/tmux-switcher" sessions'
} {
  choose-tree -ZsN -F "$TREE_FORMAT"
}
bind-key w if-shell 'command -v fzf >/dev/null 2>&1 && test -x "$HOME/.local/bin/tmux-switcher"' {
  display-popup -E -b rounded -s 'bg=colour234,fg=colour250' -S 'bg=colour234,fg=colour240' -w '82%' -h '75%' -T ' Windows ' -d '#{pane_current_path}' '"$HOME/.local/bin/tmux-switcher" windows'
} {
  choose-tree -ZwN -F "$TREE_FORMAT"
}
bind-key '?' if-shell 'test -x "$HOME/.local/bin/tmux-switcher"' {
  display-popup -E -b rounded -s 'bg=colour234,fg=colour250' -S 'bg=colour234,fg=colour240' -w '64%' -h '82%' -T ' tmux Commands ' '"$HOME/.local/bin/tmux-switcher" help'
} {
  list-keys
}
