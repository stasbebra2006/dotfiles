# --- Enable passthrough ---
# In nested tmux, the outer server receives keyboard and mouse input first.
# F12 switches it to the otherwise unused "off" key table, removes its prefix,
# and marks the session for the status-line indicator.
bind-key -T root F12 \
  set-option @passthrough on \; \
  set-option prefix None \; \
  set-option key-table off \; \
  refresh-client -S

# --- Disable passthrough ---
# This binding stays in the off table so F12 remains available in passthrough.
# It restores the inherited prefix and root key table.
bind-key -T off F12 \
  set-option -u @passthrough \; \
  set-option -u prefix \; \
  set-option -u key-table \; \
  refresh-client -S
